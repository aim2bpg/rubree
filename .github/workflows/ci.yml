name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint_ruby:
    name: Lint Ruby
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

      - name: ERB Lint
        run: bin/erb_lint --lint-all

  lint_frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Biome version
        id: biome-version
        run: echo "version=$(jq -r '.devDependencies["@biomejs/biome"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: ${{ steps.biome-version.outputs.version }}

      - name: Run Biome
        run: biome ci app/assets/stylesheets app/javascript app/views

  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Gitleaks version
        id: gitleaks-version
        run: echo "version=$(grep -oP 'GITLEAKS_VERSION=\"\K[^\"]+' .devcontainer/setup.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ steps.gitleaks-version.outputs.version }}

      - name: Install Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          VERSION="${{ steps.gitleaks-version.outputs.version }}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C ~/.local/bin gitleaks

      - name: Run Gitleaks
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks detect --source="$(pwd)" --verbose --redact --log-opts="--all --full-history"

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman
        run: bin/brakeman --no-pager --skip-files app/assets/builds/,build/,node_modules/,pwa/,rubies/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.node-version
          cache: yarn
          cache-dependency-path: ./yarn.lock

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Extract Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies.playwright' package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Install JS dependencies first (above) so this uses the pinned local
      # node_modules/.bin/playwright — otherwise npx can't find a local binary
      # and silently fetches whatever the latest playwright release is, which
      # installs browser binaries at a different revision than what the
      # bundled playwright-ruby-client gem expects ("Executable doesn't exist
      # at ...").
      - name: Install Playwright browser (Chromium, only if cache missed)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Always run, even on a browser-binary cache hit: install-deps installs
      # OS packages (apt), which the actions/cache step above never covers —
      # every job runs on a fresh runner VM with no apt packages preinstalled,
      # regardless of whether ~/.cache/ms-playwright was restored. Skipping
      # this on a cache hit previously caused "error while loading shared
      # libraries: libevent-2.1.so.7" (WebKit) once the browser-binary cache
      # started hitting.
      - name: Install Playwright OS dependencies (Chromium)
        run: npx playwright install-deps chromium

      - name: Build frontend assets
        run: yarn build && yarn build:css

      - name: Run tests
        run: bin/rspec

      # Ref-1: https://github.com/k1LoW/octocov
      # Ref-2: https://zenn.dev/shu_illy/articles/b4e635730c5ec0
      - name: Coverage Report by octocov (in this pull request)
        uses: k1LoW/octocov-action@v1

  system_test:
    name: System Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DRIVER: ${{ matrix.driver }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Firefox
            driver: playwright_firefox_headless
            playwright_browser: firefox
          - name: WebKit
            driver: playwright_webkit_headless
            playwright_browser: webkit
          - name: Selenium/Chrome
            driver: selenium_chrome_headless
            playwright_browser: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.node-version
          cache: yarn
          cache-dependency-path: ./yarn.lock

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Extract Playwright version
        if: matrix.playwright_browser != ''
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies.playwright' package.json)" >> "$GITHUB_OUTPUT"

      # Selenium/Chrome uses the Google Chrome preinstalled on GitHub-hosted ubuntu-latest
      # runners (via Selenium Manager), so there is no browser to cache or install for it.
      - name: Cache Playwright Browser (${{ matrix.playwright_browser }})
        if: matrix.playwright_browser != ''
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.playwright_browser }}-${{ steps.playwright-version.outputs.version }}

      # JS dependencies are installed first (above) so this uses the pinned local
      # node_modules/.bin/playwright — otherwise npx can't find a local binary and
      # silently fetches whatever the latest playwright release is, installing
      # browser binaries at a different revision than what the bundled
      # playwright-ruby-client gem expects ("Executable doesn't exist at ...").
      - name: Install Playwright browser (if cache missed)
        if: matrix.playwright_browser != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.playwright_browser }}

      # Always run, even on a browser-binary cache hit: install-deps installs
      # OS packages (apt), which the actions/cache step above never covers —
      # every job runs on a fresh runner VM with no apt packages preinstalled,
      # regardless of whether ~/.cache/ms-playwright was restored. Skipping
      # this on a cache hit previously caused "error while loading shared
      # libraries: libevent-2.1.so.7" (WebKit) once the browser-binary cache
      # started hitting.
      - name: Install Playwright OS dependencies
        if: matrix.playwright_browser != ''
        run: npx playwright install-deps ${{ matrix.playwright_browser }}

      - name: Build frontend assets
        run: yarn build && yarn build:css

      - name: Run system tests
        run: bin/rspec spec/system
